<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc">
  <title id="title">2027 届 AI 产品经理与策略产品经理个人作品集</title>
  <desc id="desc">把产品想法做成真正能用的东西：发现问题、做出产品、持续打磨。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09101F"/>
      <stop offset="0.55" stop-color="#13203D"/>
      <stop offset="1" stop-color="#11172B"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F7DFF"/>
      <stop offset="0.55" stop-color="#756BFF"/>
      <stop offset="1" stop-color="#9B6DFF"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44D7C6"/>
      <stop offset="0.52" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#F4C07A"/>
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#7C6CFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow">
      <stop offset="0" stop-color="#25C6B8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#25C6B8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#030712" flood-opacity="0.48"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1278" height="408" rx="30" fill="url(#background)" stroke="#2B3856"/>
  <path d="M0 0H1280V410H0Z" fill="url(#grid)"/>
  <circle cx="1115" cy="35" r="255" fill="url(#violetGlow)"/>
  <circle cx="1170" cy="365" r="245" fill="url(#tealGlow)"/>
  <path d="M745 0C835 86 855 177 818 270C787 348 808 390 857 410H1280V0Z" fill="#FFFFFF" opacity="0.018"/>
  <circle cx="1225" cy="86" r="2" fill="#F4C07A" opacity="0.9"/>
  <circle cx="758" cy="66" r="2" fill="#44D7C6" opacity="0.8"/>
  <circle cx="1155" cy="350" r="2" fill="#A8B2FF" opacity="0.8"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="72" y="55" width="174" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="92" cy="73" r="4.5" fill="#44D7C6"/>
    <text x="107" y="79" font-size="15" font-weight="650" fill="#DDE5F7">2027 届校园招聘</text>

    <text x="72" y="164" font-size="50" font-weight="720" letter-spacing="-1" fill="#F8FAFC">AI 产品经理 / 策略产品经理</text>
    <text x="72" y="220" font-size="29" font-weight="520" fill="#D6DEEE">把产品想法，做成真正能用的东西。</text>
    <text x="72" y="270" font-size="17" fill="#9DAAC2">需求洞察　·　产品设计　·　策略分析　·　AI 应用　·　快速验证</text>

    <rect x="72" y="318" width="232" height="44" rx="22" fill="url(#cta)"/>
    <rect x="72.5" y="318.5" width="231" height="43" rx="21.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.24"/>
    <text x="188" y="346" text-anchor="middle" font-size="16" font-weight="680" fill="#FFFFFF">正在寻找校招正式岗位</text>

    <g filter="url(#shadow)">
      <path d="M872 121C939 72 1045 80 1090 143C1136 209 1096 286 1029 304C960 322 880 282 883 216" fill="none" stroke="url(#route)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="7 11"/>
      <path d="M1029 304L1010 289M1029 304L1006 313" fill="none" stroke="#F4C07A" stroke-width="3" stroke-linecap="round"/>

      <circle cx="870" cy="128" r="57" fill="#111A30" fill-opacity="0.88" stroke="#44D7C6" stroke-opacity="0.65" stroke-width="2"/>
      <circle cx="1097" cy="154" r="57" fill="#151B36" fill-opacity="0.88" stroke="#7C8CFF" stroke-opacity="0.75" stroke-width="2"/>
      <circle cx="990" cy="308" r="57" fill="#181A32" fill-opacity="0.9" stroke="#F4C07A" stroke-opacity="0.65" stroke-width="2"/>

      <circle cx="870" cy="128" r="14" fill="#44D7C6" opacity="0.16" filter="url(#softGlow)"/>
      <circle cx="1097" cy="154" r="14" fill="#7C8CFF" opacity="0.2" filter="url(#softGlow)"/>
      <circle cx="990" cy="308" r="14" fill="#F4C07A" opacity="0.18" filter="url(#softGlow)"/>
      <circle cx="870" cy="128" r="7" fill="#44D7C6"/>
      <circle cx="1097" cy="154" r="7" fill="#7C8CFF"/>
      <circle cx="990" cy="308" r="7" fill="#F4C07A"/>
    </g>

    <text x="870" y="205" text-anchor="middle" font-size="15" font-weight="650" fill="#D9E3F2">发现问题</text>
    <text x="1097" y="231" text-anchor="middle" font-size="15" font-weight="650" fill="#D9E3F2">做出产品</text>
    <text x="990" y="385" text-anchor="middle" font-size="15" font-weight="650" fill="#F0E0C5">持续打磨</text>
  </g>
</svg>
