<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">2027 届 AI 产品经理与策略产品经理个人作品集</title>
  <desc id="desc">把产品想法做成真正能用的东西：发现问题、做出产品、持续打磨。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#F6F3FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4F46E5" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#312E81" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1278" height="388" rx="28" fill="url(#background)" stroke="#DDE3F0"/>
  <path d="M0 0H1280V390H0Z" fill="url(#grid)"/>
  <circle cx="1115" cy="40" r="210" fill="#DDD6FE" opacity="0.30"/>
  <circle cx="1225" cy="345" r="175" fill="#C7D2FE" opacity="0.25"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="72" y="58" width="168" height="34" rx="17" fill="#EEF2FF" stroke="#C7D2FE"/>
    <circle cx="91" cy="75" r="4" fill="#4F46E5"/>
    <text x="105" y="81" font-size="15" font-weight="600" fill="#4338CA">2027 届校园招聘</text>

    <text x="72" y="160" font-size="50" font-weight="720" letter-spacing="-1" fill="#172033">AI 产品经理 / 策略产品经理</text>
    <text x="72" y="214" font-size="28" font-weight="520" fill="#3F4658">把产品想法，做成真正能用的东西。</text>
    <text x="72" y="262" font-size="17" fill="#667085">需求洞察　·　产品设计　·　策略分析　·　AI 应用　·　快速验证</text>

    <rect x="72" y="304" width="224" height="42" rx="21" fill="url(#accent)"/>
    <text x="184" y="331" text-anchor="middle" font-size="16" font-weight="650" fill="#FFFFFF">正在寻找校招正式岗位</text>

    <g filter="url(#shadow)">
      <path d="M868 125C927 78 1025 82 1074 137C1124 193 1098 266 1034 285C969 304 886 272 882 216" fill="none" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 10"/>
      <path d="M1034 285L1018 273M1034 285L1015 292" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>

      <circle cx="866" cy="132" r="54" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
      <circle cx="1087" cy="153" r="54" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
      <circle cx="994" cy="286" r="54" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
      <circle cx="866" cy="132" r="8" fill="#4F46E5"/>
      <circle cx="1087" cy="153" r="8" fill="#6366F1"/>
      <circle cx="994" cy="286" r="8" fill="#7C3AED"/>
    </g>

    <text x="866" y="205" text-anchor="middle" font-size="15" font-weight="650" fill="#344054">发现问题</text>
    <text x="1087" y="226" text-anchor="middle" font-size="15" font-weight="650" fill="#344054">做出产品</text>
    <text x="994" y="359" text-anchor="middle" font-size="15" font-weight="650" fill="#344054">持续打磨</text>
  </g>
</svg>
