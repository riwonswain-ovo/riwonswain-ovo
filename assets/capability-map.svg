<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="214" viewBox="0 0 1280 214" role="img" aria-labelledby="title desc">
  <title id="title">产品能力地图</title>
  <desc id="desc">需求洞察、产品设计、策略分析、AI 应用与快速验证。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F7F3"/>
      <stop offset="1" stop-color="#F4F6FB"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DBFAF"/>
      <stop offset="0.5" stop-color="#657CFF"/>
      <stop offset="1" stop-color="#DDA65E"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#172033" flood-opacity="0.075"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1278" height="212" rx="24" fill="url(#canvas)" stroke="#E1E5ED"/>
  <rect x="48" y="30" width="1184" height="3" rx="1.5" fill="url(#spectrum)" opacity="0.8"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <g filter="url(#cardShadow)">
      <rect x="48" y="57" width="216" height="118" rx="16" fill="#FFFFFF" stroke="#DCE5E4"/>
      <rect x="280" y="57" width="216" height="118" rx="16" fill="#FFFFFF" stroke="#DEE3F2"/>
      <rect x="512" y="57" width="216" height="118" rx="16" fill="#FFFFFF" stroke="#DFE2F1"/>
      <rect x="744" y="57" width="216" height="118" rx="16" fill="#FFFFFF" stroke="#E4E0F0"/>
      <rect x="976" y="57" width="256" height="118" rx="16" fill="#FFFFFF" stroke="#E8E0D5"/>
    </g>

    <text x="70" y="88" font-size="14" font-weight="700" fill="#229B90">01</text>
    <text x="302" y="88" font-size="14" font-weight="700" fill="#4F72E7">02</text>
    <text x="534" y="88" font-size="14" font-weight="700" fill="#6670E8">03</text>
    <text x="766" y="88" font-size="14" font-weight="700" fill="#8B63DD">04</text>
    <text x="998" y="88" font-size="14" font-weight="700" fill="#C28A43">05</text>

    <text x="70" y="124" font-size="23" font-weight="700" fill="#172033">需求洞察</text>
    <text x="302" y="124" font-size="23" font-weight="700" fill="#172033">产品设计</text>
    <text x="534" y="124" font-size="23" font-weight="700" fill="#172033">策略分析</text>
    <text x="766" y="124" font-size="23" font-weight="700" fill="#172033">AI 应用</text>
    <text x="998" y="124" font-size="23" font-weight="700" fill="#172033">快速验证</text>

    <text x="70" y="152" font-size="15" fill="#667085">捕捉真实摩擦</text>
    <text x="302" y="152" font-size="15" fill="#667085">组织清晰体验</text>
    <text x="534" y="152" font-size="15" fill="#667085">拆解规则与取舍</text>
    <text x="766" y="152" font-size="15" fill="#667085">放大产品执行力</text>
    <text x="998" y="152" font-size="15" fill="#667085">让想法接受使用检验</text>
  </g>
</svg>
