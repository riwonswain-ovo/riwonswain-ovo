<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B16"/><stop offset=".58" stop-color="#0B1224"/><stop offset="1" stop-color="#101A31"/></linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(1110 70) rotate(135) scale(480 360)"><stop stop-color="#6F7CFF" stop-opacity=".28"/><stop offset="1" stop-color="#6F7CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(820 510) rotate(-70) scale(360 500)"><stop stop-color="#38D6C1" stop-opacity=".16"/><stop offset="1" stop-color="#38D6C1" stop-opacity="0"/></radialGradient>
